name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pip-install-and-test:
    # Verifies `pip install .` actually works on a clean system — this is the check that
    # would have caught a dependency silently missing from [project.dependencies].
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system prerequisites
        # build-essential + zlib1g-dev: needed to compile pybedtools' C extension.
        # bedtools: the CLI binary pybedtools shells out to at runtime.
        # Each apt-get step is capped so a stalled mirror fails fast with a clear error
        # instead of silently eating the whole job's timeout.
        run: |
          timeout 8m sudo apt-get update
          timeout 8m sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev bedtools

      - name: pip install
        run: pip install .[dev]

      - name: Run tests
        run: pytest

  python-version-matrix:
    # Verifies the project actually works across the full range of Python versions claimed
    # supported by requires-python in pyproject.toml — separate from pip-install-and-test
    # (which only checks one Python version) and deliberately not using pixi.lock, since a
    # lock pins to one Python version by nature and can't answer this question.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system prerequisites
        run: |
          timeout 8m sudo apt-get update
          timeout 8m sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev bedtools

      - name: Install tox
        run: pip install tox

      - name: Run tests via tox
        # `py` is tox's "current interpreter" magic factor: each matrix leg already has
        # exactly the Python version it needs from actions/setup-python, so this just runs
        # the matching tox environment directly.
        run: tox -e py

  lint-and-typecheck:
    # ruff (check + format) is pure syntax, no runtime deps needed. mypy is different: it
    # needs the actual dependency graph installed to resolve third-party return types
    # accurately (e.g. matplotlib.colors.to_hex() -> str) -- without it, every third-party
    # call resolves to Any and no-any-return fires on functions that declare a concrete
    # return type, even though the code is correctly typed against what's really installed.
    # So this job pays the same build cost as pip-install-and-test rather than staying
    # "independent" of it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system prerequisites
        run: |
          timeout 8m sudo apt-get update
          timeout 8m sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev bedtools

      - name: pip install
        run: pip install ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src
